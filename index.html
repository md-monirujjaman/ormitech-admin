<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OrmiTech Admin — internal control center for organizations, billing, channels, AI and platform operations." />
    <title>OrmiTech Admin</title>
    <script>
      // Applies the persisted theme before first paint, so there's no flash of the wrong theme once React mounts.
      (function () {
        try {
          var raw = localStorage.getItem('ormitech-admin-ui');
          var theme = raw ? JSON.parse(raw).state.theme : 'system';
          var isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (_) {
          /* localStorage unavailable or malformed — default (light) theme is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
